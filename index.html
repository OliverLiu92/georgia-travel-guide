<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>旅行手册</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E4057'/%3E%3Cpath d='M9 8h8.5a4.5 4.5 0 010 9H9V8z' fill='%23fff'/%3E%3Cpath d='M9 17h9.5a4.5 4.5 0 010 9H9v-9z' fill='%23E8EEF4'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    min-height: 100vh;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e5e5e7;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 20px 18px;
    text-align: center;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #2E4057;
    letter-spacing: .02em;
  }
  header p {
    margin-top: 6px;
    font-size: 13px;
    color: #86868b;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px calc(40px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    text-decoration: none;
    color: inherit;
    padding: 16px 16px 16px 14px;
    min-height: 92px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(46,64,87,.1);
  }
  .card:active { transform: translateY(0); }
  .flag {
    width: 56px;
    height: 40px;
    border-radius: 8px;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .flag-ge {
    background:
      linear-gradient(#E8112D, #E8112D) center / 10px 100% no-repeat,
      linear-gradient(#E8112D, #E8112D) center / 100% 8px no-repeat,
      #fff;
  }
  .flag-my {
    background:
      linear-gradient(#010066, #010066) left top / 46% 54% no-repeat,
      repeating-linear-gradient(#CC0001 0 5px, #fff 5px 9px);
    position: relative;
  }
  .flag-my::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 6px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #FC0;
    box-shadow: 4px 0 0 0 #010066;
  }
  .card-text { flex: 1; min-width: 0; }
  .card-text h2 {
    font-size: 17px;
    font-weight: 700;
    color: #2E4057;
    line-height: 1.35;
  }
  .card-text p {
    margin-top: 4px;
    font-size: 13px;
    color: #666;
    line-height: 1.45;
  }
  .chevron {
    color: #c5c5c7;
    font-size: 22px;
    line-height: 1;
    flex-shrink: 0;
  }
  @media (max-width: 480px) {
    header h1 { font-size: 20px; }
    .card { padding: 14px 12px 14px 12px; gap: 12px; }
    .flag { width: 48px; height: 34px; }
    .card-text h2 { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>旅行手册</h1>
  <p>选择一份行程</p>
</header>
<main>
  <a class="card" href="georgia/">
    <span class="flag flag-ge" aria-hidden="true"></span>
    <span class="card-text">
      <h2>格鲁吉亚</h2>
      <p>2026年7月29日–8月5日</p>
    </span>
    <span class="chevron" aria-hidden="true">›</span>
  </a>
  <a class="card" href="malaysia/">
    <span class="flag flag-my" aria-hidden="true"></span>
    <span class="card-text">
      <h2>马来西亚</h2>
      <p>2027年1月23日–28日 · 亲子游</p>
    </span>
    <span class="chevron" aria-hidden="true">›</span>
  </a>
</main>
</body>
</html>
